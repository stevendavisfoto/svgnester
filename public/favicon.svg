<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#1a1a2e"/>
  <!-- Shapes icon (Phosphor Shapes)  triangle + circle + square arrangement -->
  <!-- Square (bottom-left) -->
  <rect x="5" y="16" width="10" height="10" rx="1.5" fill="#a78bfa"/>
  <!-- Circle (bottom-right) -->
  <circle cx="22" cy="21" r="5" fill="#a78bfa"/>
  <!-- Triangle (top-center) -->
  <polygon points="16,4 25,14 7,14" fill="#a78bfa"/>
</svg>
